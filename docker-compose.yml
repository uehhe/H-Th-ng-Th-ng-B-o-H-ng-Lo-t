services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  campaign-api:
    build:
      context: .
      dockerfile: src/Campaign.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=notifications;Username=postgres;Password=postgres"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  notification-worker-1:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=notifications;Username=postgres;Password=postgres"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      WORKER_ID: notification-worker-1
      CampaignApiUrl: "http://campaign-api:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      campaign-api:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  notification-worker-2:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=notifications;Username=postgres;Password=postgres"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      WORKER_ID: notification-worker-2
      CampaignApiUrl: "http://campaign-api:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      campaign-api:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  admin-web:
    build:
      context: .
      dockerfile: src/Admin.Web/Dockerfile
    ports:
      - "5001:8080"
    environment:
      CampaignApiUrl: "http://campaign-api:8080"
      SignalRHubUrl: "http://campaign-api:8080/hubs/campaign"
    depends_on:
      campaign-api:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
